ignoreWorkspaceRootCheck: true
catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@antfu/eslint-config@9.5.1'
  - bumpp@12.2.3
  - eslint-plugin-slop@0.1.3

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true

packages:
  - playground
  - docs
  - packages/*
  - examples/*

allowBuilds:
  esbuild: true
  simple-git-hooks: true

catalogs:
  cli:
    '@antfu/eslint-config': ^9.5.1
    '@antfu/ni': ^30.5.0
    bumpp: ^12.2.3
    eslint: ^10.9.1
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.0
    nano-staged: ^1.0.2
    publint: ^0.3.24
    simple-git-hooks: ^2.14.0
    skills-npm: ^1.2.0
    tsdown: ^0.22.14
    tsx: ^4.23.13
    typescript: ^6.0.3
    vite: ^8.2.2
  inlined:
    '@antfu/utils': ^9.3.0
  testing:
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.4.2
    vitest: ^4.1.11
  types:
    '@types/node': ^26.4.1
